services:
  - type: web
    name: expense-tracker-backend
    runtime: docker
    # 🌟 FIX: Change dockerContext to rootDir 
    rootDir: backend
    # 🌟 FIX: Since rootDir moves you into the backend/ folder, 
    # the Dockerfile.prod path is now relative to that folder context.
    dockerfilePath: Dockerfile.prod
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false          
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
