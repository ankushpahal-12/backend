# Nginx TLS 1.3 & Security Headers Configuration
# Production-ready security setup

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name expense-tracker.com www.expense-tracker.com;


  # TLS Configuration - TLS 1.3 + Perfect Forward Secrecy
 
  
  # Only TLS 1.3 and 1.2 (no older versions)
  ssl_protocols TLSv1.3 TLSv1.2;
  ssl_prefer_server_ciphers on;

  # Modern ciphers with Perfect Forward Secrecy (PFS)
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

  # SSL session optimization
  ssl_session_cache shared:SSL:50m;
  ssl_session_timeout 1d;
  ssl_session_tickets off; # Disable session tickets for security

 
  # Certificate Configuration
 
  
  ssl_certificate /etc/letsencrypt/live/expense-tracker.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/expense-tracker.com/privkey.pem;

  
  # OCSP Stapling - Better certificate validation

  
  ssl_stapling on;
  ssl_stapling_verify on;
  ssl_trusted_certificate /etc/letsencrypt/live/expense-tracker.com/chain.pem;
  resolver 8.8.8.8 8.8.4.4 valid=300s;
  resolver_timeout 5s;


  # Security Headers
  
  # Force HTTPS for future requests (HSTS)
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

  # Prevent MIME type sniffing
  add_header X-Content-Type-Options "nosniff" always;

  # Prevent clickjacking
  add_header X-Frame-Options "DENY" always;

  # Enable browser XSS protection
  add_header X-XSS-Protection "1; mode=block" always;

  # Referrer policy
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Content Security Policy
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.expense-tracker.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

  # Permissions Policy (formerly Feature-Policy)
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;


  # Additional Security Headers
  

  # Disable powered by header
  fastcgi_hide_header X-Powered-By;
  proxy_hide_header X-Powered-By;

  # Add security headers for static files
  add_header Cache-Control "public, max-age=3600, must-revalidate" always;

  # Logging Configuration
 
  access_log /var/log/nginx/expense-tracker-access.log combined buffer=32k flush=5s;
  error_log /var/log/nginx/expense-tracker-error.log warn;

  # Log client IP correctly when behind reverse proxy
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Gzip Compression
 
  gzip on;
  gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
  gzip_min_length 1000;
  gzip_disable "msie6";

  
  # Proxy Configuration
 

  # Frontend
  location / {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }

  # Backend API
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    
    # Timeouts for API
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Static files with caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:3000;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Disable access to hidden files
  location ~ /\. {
    deny all;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }
}

# ============================================================
# HTTP to HTTPS Redirect
# ============================================================

server {
  listen 80;
  listen [::]:80;
  server_name expense-tracker.com www.expense-tracker.com;

  # Allow Let's Encrypt challenges
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all other traffic to HTTPS
  location / {
    return 301 https://$server_name$request_uri;
  }
}

# ============================================================
# Additional Security Recommendations
# ============================================================

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=100r/m;

# Apply rate limiting to sensitive endpoints
location /api/auth/login {
  limit_req zone=login_limit burst=5 nodelay;
  proxy_pass http://backend:3000;
}

location /api/auth/register {
  limit_req zone=login_limit burst=3 nodelay;
  proxy_pass http://backend:3000;
}

location /api/ {
  limit_req zone=api_limit burst=20 nodelay;
  proxy_pass http://backend:3000;
}
